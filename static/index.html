<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zscaler Platform Assessment</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #e2e8f0; --dim: #94a3b8; --accent: #3b82f6; --pass: #22c55e; --fail: #ef4444; --warn: #eab308; --info: #64748b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
  h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--dim); margin-bottom: 2rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  label { display: block; font-size: 0.85rem; color: var(--dim); margin-bottom: 0.3rem; }
  input, select { width: 100%; padding: 0.6rem 0.8rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .full-width { grid-column: 1 / -1; }
  .btn { padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #2563eb; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--border); color: var(--text); margin-left: 0.5rem; }
  .btn-group { margin-top: 1rem; display: flex; align-items: center; gap: 0.5rem; }

  /* Progress */
  .progress-wrap { display: none; }
  .progress-wrap.active { display: block; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 0.5rem 0; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; border-radius: 3px; }
  .progress-text { font-size: 0.85rem; color: var(--dim); }

  /* Results */
  #results { display: none; }
  .score-hero { text-align: center; padding: 2rem; }
  .score-num { font-size: 4rem; font-weight: 800; }
  .score-label { font-size: 1.2rem; color: var(--dim); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin: 1.5rem 0; }
  .stat { text-align: center; padding: 1rem; background: var(--bg); border-radius: 8px; }
  .stat-num { font-size: 1.8rem; font-weight: 700; }
  .stat-label { font-size: 0.75rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }

  /* Section scores */
  .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .section-row { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 1rem; background: var(--bg); border-radius: 6px; }
  .section-name { font-size: 0.85rem; }
  .section-score { font-weight: 700; font-size: 0.9rem; }

  /* Checks table */
  .checks-filter { margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .filter-btn { padding: 0.4rem 1rem; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--dim); cursor: pointer; font-size: 0.8rem; }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.1); }
  .check-item { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); }
  .check-item:last-child { border-bottom: none; }
  .check-status { font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; white-space: nowrap; min-width: 90px; text-align: center; }
  .status-PASS { background: rgba(34,197,94,0.15); color: var(--pass); }
  .status-FAIL { background: rgba(239,68,68,0.15); color: var(--fail); }
  .status-REVIEW { background: rgba(234,179,8,0.15); color: var(--warn); }
  .status-INFO { background: rgba(100,116,139,0.15); color: var(--info); }
  .check-body { flex: 1; }
  .check-id { font-size: 0.75rem; color: var(--dim); }
  .check-label { font-weight: 600; font-size: 0.9rem; }
  .check-detail { font-size: 0.82rem; color: var(--dim); margin-top: 0.25rem; line-height: 1.5; }
  .check-section-header { padding: 0.6rem 1rem; background: var(--accent); color: white; font-weight: 700; font-size: 0.85rem; border-radius: 6px 6px 0 0; margin-top: 1rem; }

  /* Download */
  .download-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
</style>
</head>
<body>
<div class="container">
  <h1><span>Zscaler</span> Platform Assessment</h1>
  <p class="subtitle">Automated configuration assessment across ZIA, ZPA, and ZCC</p>

  <!-- Config Form -->
  <div class="card" id="configCard">
    <h2 style="margin-bottom:1rem;">Tenant Configuration</h2>
    <div class="form-grid">
      <div><label>Organization Name</label><input id="org" value="SMOES"></div>
      <div><label>Assessor</label><input id="assessor" value="Jason"></div>
      <div><label>Cloud</label>
        <select id="cloud">
          <option value="production" selected>Production (api.zsapi.net)</option>
          <option value="zscloud">zscloud</option>
          <option value="zscaler">zscaler</option>
          <option value="zscalerone">zscalerone</option>
          <option value="zscalertwo">zscalertwo</option>
          <option value="zscalerthree">zscalerthree</option>
          <option value="zscalerbeta">zscalerbeta</option>
        </select>
      </div>
      <div><label>Vanity Domain</label><input id="vd" placeholder="e.g. Vegitto"></div>
      <div><label>Client ID</label><input id="cid" placeholder="API Client ID"></div>
      <div><label>Client Secret</label><input id="csec" type="password" placeholder="API Client Secret"></div>
      <div><label>ZPA Customer ID (optional)</label><input id="custid" placeholder="Numeric ID from ZPA portal URL (for ZPA checks)"></div>
      <div><label>Assessment Scope</label>
        <select id="scope">
          <option value="dlp">DLP Only (170 checks)</option>
          <option value="full" selected>Full Platform (223 checks)</option>
          <option value="zia">ZIA Only (DLP + Extras)</option>
          <option value="zpa">ZPA Only</option>
          <option value="zcc">ZCC Only</option>
        </select>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="runBtn" onclick="runAssessment()">Run Assessment</button>
      <span id="authStatus" style="font-size:0.85rem;color:var(--dim);"></span>
    </div>
  </div>

  <!-- Progress -->
  <div class="card progress-wrap" id="progressCard">
    <div class="progress-text" id="progressText">Starting assessment...</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressDetail"></div>
  </div>

  <!-- Results -->
  <div id="results">
    <div class="download-bar">
      <button class="btn btn-primary" onclick="downloadJSON()">Download JSON</button>
      <button class="btn btn-secondary" onclick="downloadDocx()">Download Word Doc</button>
      <button class="btn btn-secondary" onclick="resetForm()">New Assessment</button>
    </div>

    <div class="card">
      <div class="score-hero">
        <div class="score-num" id="scoreNum">0%</div>
        <div class="score-label" id="scoreLabel">Maturity Level</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-num" style="color:var(--pass)" id="passCount">0</div><div class="stat-label">Configured</div></div>
        <div class="stat"><div class="stat-num" style="color:var(--fail)" id="failCount">0</div><div class="stat-label">Action Required</div></div>
        <div class="stat"><div class="stat-num" style="color:var(--warn)" id="warnCount">0</div><div class="stat-label">Review</div></div>
        <div class="stat"><div class="stat-num" style="color:var(--info)" id="infoCount">0</div><div class="stat-label">N/A</div></div>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-bottom:1rem;">Section Scores</h2>
      <div class="section-grid" id="sectionGrid"></div>
    </div>

    <div class="card">
      <h2 style="margin-bottom:1rem;">All Findings</h2>
      <div class="checks-filter" id="filterBar">
        <button class="filter-btn active" onclick="filterChecks('all',this)">All</button>
        <button class="filter-btn" onclick="filterChecks('FAIL',this)">Action Required</button>
        <button class="filter-btn" onclick="filterChecks('REVIEW',this)">Review</button>
        <button class="filter-btn" onclick="filterChecks('PASS',this)">Configured</button>
        <button class="filter-btn" onclick="filterChecks('INFO',this)">N/A</button>
      </div>
      <div id="checksList"></div>
    </div>
  </div>
</div>

<script>
let reportData = null;

async function runAssessment() {
  const btn = document.getElementById('runBtn');
  const prog = document.getElementById('progressCard');
  const authSt = document.getElementById('authStatus');
  btn.disabled = true;
  prog.classList.add('active');
  document.getElementById('results').style.display = 'none';
  authSt.textContent = 'Connecting...';

  const body = {
    org_name: document.getElementById('org').value,
    assessor: document.getElementById('assessor').value,
    cloud: document.getElementById('cloud').value,
    vanity_domain: document.getElementById('vd').value,
    client_id: document.getElementById('cid').value,
    client_secret: document.getElementById('csec').value,
    customer_id: document.getElementById('custid').value,
    scope: document.getElementById('scope').value
  };

  try {
    const resp = await fetch('/api/assess', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const evt = JSON.parse(line.slice(6));
            handleEvent(evt);
          } catch(e) {}
        } else if (line.startsWith('event: ')) {
          // event type line, handled via data
        }
      }
    }
  } catch(e) {
    authSt.textContent = 'Error: ' + e.message;
    btn.disabled = false;
    prog.classList.remove('active');
  }
}

function handleEvent(evt) {
  if (evt.status === 'authenticating') {
    document.getElementById('authStatus').textContent = 'Authenticating...';
  } else if (evt.status === 'ok' && !evt.total) {
    document.getElementById('authStatus').textContent = 'Authenticated';
  } else if (evt.total !== undefined && evt.completed !== undefined) {
    const pct = evt.pct || Math.round((evt.completed / evt.total) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `${evt.completed} / ${evt.total} checks (${pct}%)`;
    if (evt.current) document.getElementById('progressDetail').textContent = evt.current;
  } else if (evt.score !== undefined) {
    // Complete report
    reportData = evt;
    showResults(evt);
  } else if (evt.message) {
    document.getElementById('authStatus').textContent = evt.message;
    document.getElementById('runBtn').disabled = false;
  }
}

function showResults(data) {
  document.getElementById('progressCard').classList.remove('active');
  document.getElementById('results').style.display = 'block';
  document.getElementById('runBtn').disabled = false;

  // Score
  const score = data.score;
  const el = document.getElementById('scoreNum');
  el.textContent = score + '%';
  el.style.color = score >= 75 ? 'var(--pass)' : score >= 50 ? 'var(--warn)' : 'var(--fail)';
  document.getElementById('scoreLabel').textContent = data.maturity;

  // Counts
  const checks = data.checks || [];
  document.getElementById('passCount').textContent = checks.filter(c => c.status === 'PASS').length;
  document.getElementById('failCount').textContent = checks.filter(c => c.status === 'FAIL').length;
  document.getElementById('warnCount').textContent = checks.filter(c => c.status === 'REVIEW').length;
  document.getElementById('infoCount').textContent = checks.filter(c => c.status === 'INFO' || c.status === 'ERROR').length;

  // Sections
  const grid = document.getElementById('sectionGrid');
  grid.innerHTML = '';
  for (const [sec, d] of Object.entries(data.sections || {})) {
    const pct = d.pct;
    const color = pct >= 75 ? 'var(--pass)' : pct >= 50 ? 'var(--warn)' : 'var(--fail)';
    grid.innerHTML += `<div class="section-row"><span class="section-name">${sec}</span><span class="section-score" style="color:${color}">${pct}%</span></div>`;
  }

  // Checks
  renderChecks(checks, 'all');
}

function renderChecks(checks, filter) {
  const list = document.getElementById('checksList');
  list.innerHTML = '';
  let curSec = '';
  for (const c of checks) {
    const st = c.status === 'ERROR' ? 'INFO' : c.status;
    if (filter !== 'all' && st !== filter) continue;
    if (c.section !== curSec) {
      curSec = c.section;
      list.innerHTML += `<div class="check-section-header">${curSec}</div>`;
    }
    const stLabel = {PASS:'Configured',FAIL:'Action Required',REVIEW:'Needs Review',INFO:'N/A'}[st] || st;
    list.innerHTML += `<div class="check-item"><span class="check-status status-${st}">${stLabel}</span><div class="check-body"><span class="check-id">${c.id}</span> <span class="check-label">${c.label}</span><div class="check-detail">${c.detail || ''}</div></div></div>`;
  }
  if (!list.innerHTML) list.innerHTML = '<p style="padding:1rem;color:var(--dim)">No checks match this filter.</p>';
}

function filterChecks(status, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderChecks(reportData.checks || [], status);
}

function downloadJSON() {
  if (!reportData) return;
  const blob = new Blob([JSON.stringify(reportData, null, 2)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `zscaler_${reportData.metadata?.org || 'report'}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

async function downloadDocx() {
  if (!reportData) return;
  try {
    const resp = await fetch('/api/report/docx', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(reportData)
    });
    if (!resp.ok) { alert('Word doc generation failed'); return; }
    const blob = await resp.blob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `zscaler_${reportData.metadata?.org || 'report'}_${new Date().toISOString().slice(0,10)}.docx`;
    a.click();
  } catch(e) { alert('Error: ' + e.message); }
}

function resetForm() {
  document.getElementById('results').style.display = 'none';
  reportData = null;
}
</script>
</body>
</html>
