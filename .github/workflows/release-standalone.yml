name: Release standalone

# The no-install edition: one PyInstaller build per platform, each on its own
# runner (PyInstaller does not cross-compile), smoke-tested from the archive
# that ships, checksummed, and given signed SLSA build provenance. Builds are
# workflow artifacts on every run; only a version tag attaches them to a
# GitHub Release. Nothing built here is ever committed to the repository.
#
# Code signing is optional and runs only when the repository has the secrets:
#   Windows  WINDOWS_SIGNING_PFX_BASE64, WINDOWS_SIGNING_PFX_PASSWORD
#   macOS    MACOS_SIGNING_P12_BASE64, MACOS_SIGNING_P12_PASSWORD, MACOS_SIGNING_IDENTITY
#            (+ MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_PASSWORD to notarize)
# Without them the build is unsigned, and the archive's README and the release
# notes say so.
#
# Build provenance (SLSA, actions/attest-build-provenance) needs GitHub's
# attestations, which a private repository has only on Enterprise Cloud. It
# runs when the repository is public or the repository variable
# STANDALONE_PROVENANCE is "true"; then it must succeed and every archive is
# verified before publishing. Otherwise it is skipped and the release notes
# say the build has no provenance (the checksums are still checked).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PROVENANCE: ${{ (!github.event.repository.private || vars.STANDALONE_PROVENANCE == 'true') && 'true' || 'false' }}

concurrency:
  group: release-standalone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write       # a short-lived Sigstore certificate for the provenance signature
      attestations: write   # store the provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: windows-x64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
          - os: ubuntu-22.04   # the oldest supported glibc this runner set offers, so the binary runs on more distributions
            label: linux-x64
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      # Whether each optional signing step has its secrets (true/false only; the secrets themselves stay in the steps that use them).
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 != '' && secrets.WINDOWS_SIGNING_PFX_PASSWORD != '' }}
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_SIGNING_P12_BASE64 != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
      HAS_MACOS_NOTARY: ${{ secrets.MACOS_NOTARY_APPLE_ID != '' && secrets.MACOS_NOTARY_TEAM_ID != '' && secrets.MACOS_NOTARY_PASSWORD != '' }}
      # A tag's name is the version; any other run is dev-<commit>.
      STANDALONE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # nothing here pushes: keep GITHUB_TOKEN out of .git/config

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the app and PyInstaller (all hash-verified)
        shell: bash
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pip.lock
          python -m pip install --require-hashes --no-deps -r requirements.lock
          # PyInstaller, its hooks and loader dependencies, hash-pinned for every OS (make lock-ci).
          python -m pip install --require-hashes --no-deps -r requirements-ci.lock
          python -m pip check

      - name: Import the macOS signing identity into a throw-away keychain
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw="$(openssl rand -hex 24)"
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Build with PyInstaller
        id: build
        shell: bash
        env:
          # Set only when the identity was imported above; PyInstaller then signs every binary with the hardened runtime.
          STANDALONE_CODESIGN_IDENTITY: ${{ runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          STANDALONE_ENTITLEMENTS: ${{ runner.os == 'macOS' && format('{0}/tools/standalone_entitlements.plist', github.workspace) || '' }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$RUNNER_OS" = "Windows" ] && [ "$HAS_WINDOWS_SIGNING" = "true" ]; then flags+=(--signed); fi
          if [ "$RUNNER_OS" = "macOS" ] && [ "$HAS_MACOS_SIGNING" = "true" ]; then
            flags+=(--signed)
            if [ "$HAS_MACOS_NOTARY" = "true" ]; then flags+=(--notarized); fi
          fi
          python tools/build_standalone.py --build-only --out dist/standalone ${flags[@]+"${flags[@]}"} | tail -n 1 > build.json
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          b = json.load(open("build.json"))
          print(f"folder={b['folder']}")
          print(f"exe={b['exe']}")
          EOF

      - name: Sign the Windows program (Authenticode, timestamped)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          EXE: ${{ steps.build.outputs.exe }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:PFX_PASSWORD $env:EXE
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
            & $signtool.FullName verify /pa $env:EXE
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed" }
          } finally {
            Remove-Item -Force $pfx
          }

      - name: Notarize the macOS build
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true' && env.HAS_MACOS_NOTARY == 'true'
        shell: bash
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          FOLDER: ${{ steps.build.outputs.folder }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$FOLDER/ZscalerMadeEasy"
          ditto -c -k --keepParent "$FOLDER" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          rm -f "$RUNNER_TEMP/notarize.zip"

      - name: Remove the throw-away keychain
        if: always() && runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Pack the archive and its SHA-256
        id: package
        shell: bash
        env:
          FOLDER: ${{ steps.build.outputs.folder }}
        run: |
          set -euo pipefail
          python tools/build_standalone.py --package-only "$FOLDER" --out dist/release | tail -n 1 > package.json
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          p = json.load(open("package.json"))
          print(f"archive={p['archive']}")
          print(f"name={os.path.basename(p['archive'])}")
          EOF
          cat dist/release/*.sha256

      - name: Smoke-test the archive that ships (start, GET /api/health with the token, stop)
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: python tools/smoke_standalone.py "$ARCHIVE" --commit "$GITHUB_SHA"

      - name: SLSA build provenance (signed, verifiable with gh attestation verify)
        if: env.PROVENANCE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: standalone-${{ matrix.label }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  release:
    # Only a version tag publishes; a manual run stops at the workflow artifacts above.
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write       # create the GitHub Release and attach the builds
      attestations: read    # verify each build's provenance before publishing it
    env:
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 != '' && secrets.WINDOWS_SIGNING_PFX_PASSWORD != '' }}
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_SIGNING_P12_BASE64 != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
      HAS_MACOS_NOTARY: ${{ secrets.MACOS_NOTARY_APPLE_ID != '' && secrets.MACOS_NOTARY_TEAM_ID != '' && secrets.MACOS_NOTARY_PASSWORD != '' }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: standalone-*
          merge-multiple: true
          path: release

      - name: Check every checksum and every attestation before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          for f in *.sha256; do sha256sum --check --strict "$f"; done
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          if [ "$PROVENANCE" = "true" ]; then
            for f in *.zip *.tar.gz; do
              gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-standalone.yml"
            done
          else
            echo "Build provenance is off for this repository (private, and STANDALONE_PROVENANCE is not true): the checksums were checked, no attestation exists."
          fi

      - name: Write the release notes (says plainly when a build is unsigned)
        run: |
          set -euo pipefail
          {
            echo "## Zscaler Made Easy $GITHUB_REF_NAME, standalone edition"
            echo
            echo "**Open source.** Zscaler Made Easy is open-source software under the Apache License 2.0 (see LICENSE). It is built entirely from information provided by Zscaler (its public documentation, public API and open-source SDKs and Terraform providers) and by third parties. It is an independent project, not an official Zscaler product; Zscaler and related marks belong to Zscaler, Inc."
            echo
            echo "No installation: download the archive for your system, check it, unpack it and double-click **ZscalerMadeEasy**."
            echo "INSTALL.md, section \"Download and run\", has every step."
            echo
            echo "| System | File |"
            echo "|---|---|"
            for f in release/*.zip release/*.tar.gz; do n="$(basename "$f")"; echo "| ${n#ZscalerMadeEasy-"$GITHUB_REF_NAME"-} | \`$n\` |"; done
            echo
            echo "### Check the download first"
            echo
            echo "1. Its SHA-256 must match \`SHA256SUMS.txt\` (and the archive's own \`.sha256\` file)."
            if [ "$PROVENANCE" = "true" ]; then
              echo "2. GitHub must vouch that it was built from this repository by this workflow:"
              echo "   \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`"
            else
              echo "2. **No build provenance.** This repository is private, and GitHub attests builds only for public repositories (or Enterprise Cloud), so there is no attestation to verify; the checksum is the only check."
            fi
            echo
            echo "### Code signing"
            echo
            if [ "$HAS_WINDOWS_SIGNING" = "true" ]; then echo "- Windows: signed (Authenticode, timestamped)."; else echo "- **Windows: UNSIGNED.** SmartScreen will warn on the first start; allow it only after the checks above succeed."; fi
            if [ "$HAS_MACOS_SIGNING" = "true" ] && [ "$HAS_MACOS_NOTARY" = "true" ]; then echo "- macOS: signed with a Developer ID and notarized by Apple."
            elif [ "$HAS_MACOS_SIGNING" = "true" ]; then echo "- **macOS: signed but NOT notarized.** Gatekeeper will ask on the first start; allow it only after the checks above succeed."
            else echo "- **macOS: UNSIGNED.** Gatekeeper will block the first start; allow it only after the checks above succeed (INSTALL.md says how, without turning Gatekeeper off)."; fi
            echo "- **Linux: unsigned** (Linux has no system-wide code signing for programs); the checksum$( [ "$PROVENANCE" = "true" ] && echo " and the attestation are the checks" || echo " is the check")."
            echo
            echo "Secure defaults that cannot be switched off in this edition: it listens on 127.0.0.1 only, asks every browser for the UI token, and starts read-only."
          } > notes.md
          cat notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.tar.gz release/*.sha256 release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Zscaler Made Easy $GITHUB_REF_NAME (standalone)" --notes-file notes.md
