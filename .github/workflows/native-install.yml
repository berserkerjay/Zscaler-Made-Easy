name: Native local installs

# macOS minutes bill at 10x and Windows at 2x on a private repository, so the seven
# native installs run on pull requests into main, pushes to main, weekly and by hand,
# not on every pull request into dev (the Tests workflow covers those on Linux).
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * 1"   # weekly, Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or branch cancels the run it replaces.
concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-install:
    # A promotion PR (dev -> qa, qa -> main) carries code that already passed this job on its own PR into dev,
    # so it is not run again; every other PR and every push to main runs it.
    if: ${{ !(github.event_name == 'pull_request' && ((github.base_ref == 'qa' && github.head_ref == 'dev') || (github.base_ref == 'main' && github.head_ref == 'qa'))) }}
    name: Native ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.11", "3.14"]
        include:
          - os: macos-15-intel
            python: "3.11"
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      NATIVE_REQUIRE_TERRAFORM: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # nothing here pushes: keep GITHUB_TOKEN out of .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"  # exact, not the moving 22 line
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Real Git and ZIP installers, reinstall, native launch and browser verification
        run: python tools/verify_native_install.py --artifacts artifacts/native-install
      - name: Preserve exact-commit platform, lifecycle, browser and TLS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.os }}-python-${{ matrix.python }}
          path: artifacts/native-install
          if-no-files-found: error
