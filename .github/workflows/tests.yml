name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # nothing here pushes: keep GITHUB_TOKEN out of .git/config

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.22.2"  # exact, not the moving 22 line; built-in WebSocket required by the browser acceptance drivers

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pip.lock
          # Hash-verified, same as the installer, the updater and the container —
          # the tests run against exactly what a real install gets, not a loose
          # requirements.txt resolution.
          pip install --require-hashes --no-deps -r requirements.lock
          # Test tools (pytest, pyflakes, httpx for the TestClient) are
          # hash-pinned too, compiled against requirements.lock so they keep
          # its pins for every package the two share.
          pip install --require-hashes --no-deps -r requirements-dev.lock
          pip check

      - name: Byte-compile Python sources
        run: python -m py_compile $(git ls-files '*.py')

      - name: Syntax-check GUI scripts
        run: |
          for f in static/*.js; do node --check "$f"; done

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Standards mapping and quality score are current
        run: |
          # tests/test_security_test_matrix.py and tests/test_quality_score.py run these in the step above too;
          # named here so a stale docs/SECURITY_TESTING.md, docs/QUALITY_SCORE.md or docs/quality_score.json is obvious.
          python tools/security_test_matrix.py --check
          python tools/quality_score.py --check

      - name: Smoke-test API server and Deploy Studio injection
        run: |
          python - <<'EOF'
          import os; os.environ["ZSCALER_UI_AUTH"] = "0"
          from fastapi.testclient import TestClient
          import dlp_api_server as srv

          c = TestClient(srv.app)
          r = c.get("/")
          assert r.status_code == 200, r.status_code
          html = r.text
          assert "deploy_studio.css" in html, "CSS add-on not injected"
          assert "deploy_studio.js" in html, "JS add-on not injected"
          for asset in ("/static/deploy_studio.js", "/static/deploy_studio.css"):
              a = c.get(asset)
              assert a.status_code == 200, f"{asset}: {a.status_code}"
          packs = c.get("/api/dlp-packs")
          assert packs.status_code == 200, packs.status_code
          ids = sorted(p["id"] for p in packs.json().get("packs", []))
          print("packs:", ids)
          assert "fed_policy_pack" in ids and "cjis_policy_pack" in ids
          # Writes must be disabled by default: apply endpoint refuses.
          r = c.post("/api/dlp-packs/apply", json={"pack_ids": ids, "plan_hash": "x", "confirm": True, "assessor": "Synthetic CI Assessor"})
          assert r.status_code == 403, (r.status_code, r.text[:200])
          print("smoke OK")
          EOF

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Every pack mirrors its inline rules onto endpoint, saas and email
        run: python tools/fan_out_channels.py --check

      - name: Every payload field the app sends is known to the installed SDK (offline upstream check)
        run: python upstream_check.py --offline

      - name: Committed Terraform workspaces are up to date
        run: |
          python pack_terraform.py --out terraform
          # New, changed or deleted files all count: `git diff` alone misses a file the generator starts or stops emitting.
          if [ -n "$(git status --porcelain -- terraform)" ]; then git status --porcelain -- terraform; echo "::error::terraform/ is stale; run: python pack_terraform.py --out terraform and commit every change"; exit 1; fi

      - name: Generated Terraform is terraform fmt-clean
        run: |
          python tools/terraform_samples.py /tmp/tf_samples
          terraform fmt -check -recursive -diff terraform/ /tmp/tf_samples/vendor_hcl /tmp/tf_samples/containment /tmp/tf_samples/endpoint /tmp/tf_samples/tenant

      - name: Validate generated Terraform against the zscaler/zia provider
        run: |
          rc=0
          for d in terraform/*/ /tmp/tf_samples/vendor_hcl/ /tmp/tf_samples/vendor_json/ /tmp/tf_samples/containment/ /tmp/tf_samples/endpoint/; do
            echo "== $d"
            terraform -chdir="$d" init -backend=false -input=false -no-color >/dev/null || { rc=1; continue; }
            terraform -chdir="$d" validate -no-color || rc=1
          done
          exit $rc

      # Advisory until a first green run: the whole-tenant export (tenant_terraform) of the
      # sample tenant against the zscaler/zia and zscaler/zpa providers it pins.
      - name: Validate the whole-tenant export of the sample tenant (advisory)
        continue-on-error: true
        run: |
          rc=0
          for d in /tmp/tf_samples/tenant/tenant-terraform/zia/ /tmp/tf_samples/tenant/tenant-terraform/zpa/; do
            echo "== $d"
            terraform -chdir="$d" init -backend=false -input=false -no-color >/dev/null || { rc=1; continue; }
            terraform -chdir="$d" validate -no-color || rc=1
          done
          exit $rc

      - name: Print file fingerprints
        run: sha1sum $(git ls-files '*.py' 'static/*' 'tests/*' 'POLICY_PACKS.md')

  browser-acceptance:
    # Real production-page checks. A green unit run or DOM shim is not this gate.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DLP_RUN_BROWSER_ACCEPTANCE: "1"
      BROWSER_ACCEPTANCE_ARTIFACTS: artifacts/browser-acceptance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"  # exact, as above
      - name: Install the same hash-pinned application and test dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pip.lock
          pip install --require-hashes --no-deps -r requirements.lock
          pip install --require-hashes --no-deps -r requirements-dev.lock
          pip check
      - name: Verify the runner browser is available
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
          node -e "if (typeof WebSocket !== 'function') process.exit(1)"
      - name: Exercise production flows, embeds and guided reference players
        run: |
          mkdir -p artifacts/browser-acceptance
          python -m pytest -q tests/test_flow_browser_acceptance.py --junitxml=artifacts/browser-acceptance/results.xml
      - name: Keep browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-acceptance
          path: artifacts/browser-acceptance
          if-no-files-found: error

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # nothing here pushes: keep GITHUB_TOKEN out of .git/config

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pip, the app and the supply-chain tools (all hash-verified)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pip.lock
          pip install --require-hashes --no-deps -r requirements.lock
          # uv, pip-audit and cyclonedx-bom with every dependency they pull in,
          # pinned by hash and compiled against requirements.lock (make lock-ci),
          # so nothing here is resolved fresh from PyPI on this run.
          pip install --require-hashes --no-deps -r requirements-ci.lock
          pip check

      - name: Lock files match their requirements (hash-pinned)
        run: |
          # Compile on top of the committed lock: uv keeps every pin that still
          # satisfies requirements.txt, so this fails when requirements.txt
          # changed without a re-lock, not whenever a dependency publishes a new
          # version (new versions are picked up by `make lock`; known
          # vulnerabilities in the pinned set are caught by pip-audit below).
          # --universal: the lock covers Windows and macOS too (pywin32 and
          # colorama behind sys_platform markers), not only this Linux runner.
          cp requirements.lock requirements.check
          uv pip compile --quiet --universal --python-version 3.11 --generate-hashes --output-file requirements.check requirements.txt
          # Only the pinned package set must match; hashes are refreshed by the same tool.
          diff <(grep -E '^[a-zA-Z0-9_.-]+==' requirements.lock | sort) <(grep -E '^[a-zA-Z0-9_.-]+==' requirements.check | sort) \
            || { echo "::error::requirements.lock is stale (a dependency published a new version); run: make lock  (uv pip compile --universal --python-version 3.11 --generate-hashes --upgrade --output-file requirements.lock requirements.txt) and commit the result"; exit 1; }
          # Same for the test tools' lock, resolved against the app's lock.
          cp requirements-dev.lock requirements-dev.check
          uv pip compile --quiet --universal --python-version 3.11 --generate-hashes -c requirements.lock --output-file requirements-dev.check requirements-dev.txt
          diff <(grep -E '^[a-zA-Z0-9_.-]+==' requirements-dev.lock | sort) <(grep -E '^[a-zA-Z0-9_.-]+==' requirements-dev.check | sort) \
            || { echo "::error::requirements-dev.lock is stale; run: make lock-dev and commit the result"; exit 1; }
          # And the CI tools' locks (pip itself; uv, pip-audit, cyclonedx-bom).
          cp requirements-pip.lock requirements-pip.check
          uv pip compile --quiet --universal --python-version 3.11 --generate-hashes --output-file requirements-pip.check requirements-pip.txt
          cp requirements-ci.lock requirements-ci.check
          uv pip compile --quiet --universal --python-version 3.11 --generate-hashes -c requirements.lock -c requirements-pip.lock --output-file requirements-ci.check requirements-ci.txt
          for l in requirements-pip requirements-ci; do
            diff <(grep -E '^[a-zA-Z0-9_.-]+==' $l.lock | sort) <(grep -E '^[a-zA-Z0-9_.-]+==' $l.check | sort) \
              || { echo "::error::$l.lock is stale; run: make lock-ci and commit the result"; exit 1; }
          done

      - name: Known-vulnerability audit (every lock CI or an install uses)
        run: |
          # --disable-pip: the locks are fully pinned and hashed, so pip-audit
          # audits exactly those pins and never runs pip (which would otherwise
          # upgrade pip, wheel and setuptools, unpinned, in a temporary venv).
          for l in requirements.lock requirements-dev.lock requirements-ci.lock requirements-pip.lock; do
            echo "== $l"
            pip-audit -r "$l" --disable-pip --strict --desc on
          done

      - name: Software bill of materials (CycloneDX)
        run: |
          # cyclonedx-bom came from requirements-ci.lock above. Same commands as docs/SBOM.md. cyclonedx-py reads only the lock,
          # which holds no licences and no Terraform provider; sbom_enrich.py
          # adds both, builds the dependency graph from the lock (fails on a
          # package with no recorded licence) and
          # rewrites THIRD_PARTY_NOTICES.md. The committed files must match.
          cyclonedx-py requirements --pyproject pyproject.toml --mc-type application --output-reproducible --of JSON -o docs/sbom.cdx.json requirements.lock
          python tools/sbom_enrich.py docs/sbom.cdx.json
          git diff --exit-code -- docs/sbom.cdx.json THIRD_PARTY_NOTICES.md             || { echo "::error::docs/sbom.cdx.json or THIRD_PARTY_NOTICES.md is stale; regenerate them as docs/SBOM.md describes and commit the result"; exit 1; }
          cp docs/sbom.cdx.json sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

  windows-lock:
    # The Windows installer (INSTALL_Zscaler_Made_Easy.bat) installs the lock
    # with --no-deps, so every Windows-only dependency must be pinned in it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # nothing here pushes: keep GITHUB_TOKEN out of .git/config

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install from the lock on Windows (hash-verified, no resolver)
        shell: bash
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-pip.lock
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip check
          python -c "import dlp_api_server, dlp_mcp_server"
          python -m pip install --require-hashes --no-deps -r requirements-ci.lock

      - name: Known-vulnerability audit of the Windows install
        # pip-audit evaluates the locks' sys_platform markers on the machine it
        # runs on, so the Linux audit skips the Windows-only pins (pywin32,
        # colorama); this one covers them.
        shell: bash
        env:
          # The advisories' descriptions are not all cp1252; without this the
          # report itself crashes on the Windows console encoding.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          for l in requirements.lock requirements-dev.lock requirements-ci.lock; do
            echo "== $l"
            pip-audit -r "$l" --disable-pip --strict --desc on
          done

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # nothing here pushes: keep GITHUB_TOKEN out of .git/config

      - name: Build the image
        run: docker build -t zscaler-made-easy:ci .

      - name: Image runs as non-root and answers /api/ping
        run: |
          # Published on the host's loopback only (see -p below); the container's
          # own internal bind is 0.0.0.0 (baked in by the Dockerfile) and
          # DLP_CHECK_HOST_BIND defaults to loopback, so it starts without SSO.
          # The UI token gate stays on (a container cannot tell a loopback
          # caller from one on its network, so ZSCALER_UI_AUTH=0 is refused):
          # a fixed CI token proves the gate admits it and refuses no token.
          id=$(docker run -d --read-only --tmpfs /tmp -p 127.0.0.1:8000:8000 -e ZSCALER_UI_TOKEN=ci-smoke-token zscaler-made-easy:ci)
          sleep 8
          docker exec "$id" id -u | grep -qv '^0$'
          curl -fsS http://127.0.0.1:8000/api/ping
          curl -fsS -H "X-DLP-Check-Token: ci-smoke-token" http://127.0.0.1:8000/api/health >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)" = "401"
          docker rm -f "$id" >/dev/null

      - name: Moving to the new name copies the old data volume and keeps it
        run: |
          # An install from before the rename: data on <folder>_dlpcheck-data.
          docker tag zscaler-made-easy:ci zscaler-made-easy:local
          docker run --rm -v dlp-check_dlpcheck-data:/data -w /data --entrypoint sh zscaler-made-easy:ci \
            -c 'echo marker > tenant_profiles.json && chmod 600 tenant_profiles.json'
          bash update_container.sh --migrate-only | tee first.txt
          grep -q "Copied dlp-check_dlpcheck-data into zscaler-made-easy-data" first.txt
          docker run --rm -v zscaler-made-easy-data:/data:ro -w /data --entrypoint sh zscaler-made-easy:ci \
            -c 'test "$(cat tenant_profiles.json)" = marker && test "$(stat -c %a tenant_profiles.json)" = 600'
          docker volume inspect dlp-check_dlpcheck-data >/dev/null   # the old volume is kept
          bash update_container.sh --migrate-only | tee second.txt
          if grep -q "Copied" second.txt; then echo "::error::the second run copied again"; exit 1; fi

      - name: Scan the image for known vulnerabilities (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH --format table zscaler-made-easy:ci

      - name: Image SBOM (CycloneDX, every OS and Python package in the image)
        run: |
          # docs/sbom.cdx.json covers the Python lock and the Terraform provider
          # only; this inventories the built image, including the base image's
          # CPython and Debian packages (docs/SBOM.md).
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --format cyclonedx --output /out/image-sbom.cdx.json zscaler-made-easy:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: image-sbom
          path: image-sbom.cdx.json
