py-modules = [
    "app_update", "audit", "beacon", "beacon_scope", "benchmarks", "bp_crawler", "bp_sources", "bypass_report", "change_queue", "channel_scope", "compliance_mapping", "console_index", "csv_safe", "md_safe", "xlsx_writer", "policy_exports", "url_tools", "config_exports", "engine_explain", "audit_timeline", "admin_ops", "ops_zcc", "ops_zdx", "ops_zpa", "workspace_notes", "ai_guard", "ops_aiguard", "pov", "bulk_test", "ops_zia_baseline", "rule_editor", "ops_rule_editor", "ops_zia_objects", "config_backup", "ops_config_restore", "ops_rule_csv", "rule_csv", "sync_jobs", "ops_fw_import", "panos_migrate", "local_plugins", "update_notify", "tui", "ops_list_fix",
    "continuous_eval", "corpus_engines", "safe_files", "posture_plus", "data_flow", "ssl_coverage", "deployments", "detection_health", "discover_endpoints", "readiness", "zia_path_modules", "rule_fields", "category_lookup", "ucaas_oneclick",
    "dlp_analysis", "dlp_api_server", "dlp_assessment_full_auto", "dlp_efficacy", "dlp_importer", "dlp_mcp_server", "guidance", "insights", "device_posture", "offline_tenant", "sample_tenant",
    "log_analyzer", "native_zscaler", "pack_channels", "pack_deploy", "pack_export", "pack_from_tenant", "pack_jobs", "pack_library", "pack_ops", "path_analyzer", "tenant_auth", "tenant_fingerprint", "pac_eval", "path_whatif",
    "pack_removal", "pack_terraform", "permissions", "plain_english", "proposal_apply", "proposals", "remediation",
    "pdf_writer", "report_docx", "report_exports", "rule_migrator", "saas_email_checks", "saas_matrix", "scope_permissions", "sdk_client", "secure_by_design", "security", "self_heal",
    "scenario_flow", "shadow_rules", "sso", "ssl_flow", "tenant_profiles", "upstream_check", "vendor_migrate", "vertical", "zcc_evaluation", "zia_rate", "zscaler_automation_checks", "zscaler_best_practices",
    "zcc_profiles", "zscaler_clouds", "zscaler_full_checks", "zscaler_genai_checks", "zscaler_rbac_checks", "zscaler_update_check", "zcc_fleet", "zcc_bypass", "zcc_otp",
    "zscaler_zdx_checks", "zscaler_zidentity_checks", "zpa_analysis", "zpa_overview", "zpa_reader", "browser_security", "standalone_main", "zpa_path", "workload_path",
    "admin_rank", "app_services", "m365_endpoints", "rank_inherit", "compliance_profiles", "compliance_pack", "mcp_tools", "dns_forward_zones", "ops_zcc_admin", "ops_zdx_trace", "ops_zia_directory", "ops_zia_pac", "ops_zid", "ops_zpa_admin", "path_compare", "path_device", "path_probe", "zpa_identity", "zscaler_ip_ranges", "server_acme", "server_tls", "store_crypto", "team_api", "team_routes", "team_server", "tenant_terraform", "tenant_terraform_schema", "zcc_fleet_history", "zcc_fleet_import", "siem_queries", "traffic_logs", "api_calls", "tenant_health",
]

# The offline Python static analyser (SAST): make sast, and
# tests/test_sast.py in every test run (CI included). Every check runs (no
# `skips`, no `tests` allow-list); the gate is medium severity and up at any
# confidence. A finding is fixed at the root, or, when bandit misreads the
# code, suppressed on its own line as `# nosec <id> # <why>` (the second `#`
# keeps bandit from reading the reason as check names); the reviewed list
# of those is tests/test_sast.py's REVIEWED_SUPPRESSIONS. Bandit matches an
# excluded path as a substring of "./<path>", so these only work with the
# target `.` from the repository root, as make sast and the test run it.
[tool.bandit]
exclude_dirs = ["./tests/", "./.venv/", "./venv/", "./build/", "./dist/", "./node_modules/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
